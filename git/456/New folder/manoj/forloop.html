<html>
<body>

<script type="text/javascript">

document.write("<h1> FOR LOOP</h1>");

var count;

document.write("Starting Loop from 0" + "<br />");

for (count = 0; count < 10; count++) {
    document.write("Current Count : " + count);
    document.write("<br />");
}

document.write("Loop stopped 9!");

</script>

</body>
</html>
