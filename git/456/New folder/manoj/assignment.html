<html>
<body>

<script type="text/javascript">
var a = 33;
var b = 10;
var linebreak = "<br />";

document.write("<h2>Assignment Operations</h2>");

document.write("Assignment Operation &nbsp;&nbsp; Value of A=10 &nbsp;&nbsp; Value of B=10");
document.write(linebreak);

document.write("(a = b) &nbsp;&nbsp;&nbsp;&nbsp; ");
result = (a = b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

document.write("(a += b) &nbsp;&nbsp;&nbsp; ");
result = (a += b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

document.write("(a -= b) &nbsp;&nbsp;&nbsp; ");
result = (a -= b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

document.write("(a *= b) &nbsp;&nbsp;&nbsp; ");
result = (a *= b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

document.write("(a /= b) &nbsp;&nbsp;&nbsp; ");
result = (a /= b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

document.write("(a %= b) &nbsp;&nbsp;&nbsp; ");
result = (a %= b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

</script>

</body>
</html>
