<html>
<body>

<script type="text/javascript">

document.write("<h1>DO WHILE LOOP</h1>");

var count = 0;

document.write("Starting Loop from 0" + "<br />");

do {
    document.write("Current Count : " + count + "<br />");
    count++;
} while (count < 5);

document.write("Loop stopped!");

</script>

</body>
</html>
