<html>
<body>

<script type="text/javascript">
var a = 10;
var b = 20;
var linebreak = "<br />";

document.write("<h2>Comparison Operations</h2>");

document.write("Comparison Operation &nbsp;&nbsp; Value of A=10 &nbsp;&nbsp; Value of B=20");
document.write(linebreak);

document.write("(a == b) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ");
result = (a == b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + a + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

document.write("(a < b) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ");
result = (a < b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + a + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

document.write("(a > b) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ");
result = (a > b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + a + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

document.write("(a != b) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ");
result = (a != b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + a + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

document.write("(a >= b) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ");
result = (a >= b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + a + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

document.write("(a <= b) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ");
result = (a <= b);
document.write(result + " &nbsp;&nbsp;&nbsp;&nbsp; " + a + " &nbsp;&nbsp;&nbsp;&nbsp; " + b);
document.write(linebreak);

</script>

</body>
</html>
